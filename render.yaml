# One-click deployment blueprint for Render.
#
# Point Render at this repository and it reads this file: no manual service
# configuration, and the disk below is what keeps the database between
# deploys.
#
# A disk requires a paid instance type. On a free instance the filesystem is
# wiped on every restart, which for this app means losing the resume, the
# jobs, the prepared answers and the interview history - so free is not an
# option here, it is data loss on a timer.

services:
  - type: web
    name: ai-interview-copilot
    runtime: docker
    # Render renamed compute plans in 2026; this appears as `0.5c-512mb`
    # (0.5 CPU, 512 MB) in the dashboard. The legacy name still resolves.
    #
    # This is the per-service compute cost and is separate from the workspace
    # plan. The workspace should stay on Hobby, which is free - Pro at
    # $25/month buys team seats that a single-user app has no use for.
    plan: starter
    region: oregon
    healthCheckPath: /login
    disk:
      name: copilot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Set in the Render dashboard, not here - this file is in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Signs the login session. Render generates one; changing it later logs
      # everyone out, which is harmless but surprising.
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/app.db
      - key: NODE_ENV
        value: production
